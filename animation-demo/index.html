<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>نمونه‌ی انیمیشن — Cursor Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b1210;
      --deep: #12201c;
      --mist: #1a2e28;
      --foam: #e8f2ec;
      --muted: #9bb5a8;
      --ember: #e8a45a;
      --glow: #7ec8a3;
      --line: rgba(232, 242, 236, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--ink);
      color: var(--foam);
      font-family: "Vazirmatn", system-ui, sans-serif;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 70% 35%, rgba(126, 200, 163, 0.18), transparent 55%),
        radial-gradient(ellipse 50% 45% at 20% 70%, rgba(232, 164, 90, 0.14), transparent 50%),
        linear-gradient(160deg, var(--ink) 0%, var(--deep) 45%, #0e1814 100%);
      animation: breathe 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { filter: saturate(1) brightness(1); }
      50% { filter: saturate(1.15) brightness(1.06); }
    }

    .grid {
      position: absolute;
      inset: -10%;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 64px 64px;
      transform: perspective(600px) rotateX(58deg) translateY(-8%);
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
      opacity: 0.45;
      animation: gridDrift 18s linear infinite;
    }

    @keyframes gridDrift {
      from { background-position: 0 0, 0 0; }
      to { background-position: 0 64px, 64px 0; }
    }

    .orbit {
      position: absolute;
      width: min(72vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(232, 242, 236, 0.1);
      animation: spin 28s linear infinite;
    }

    .orbit::before,
    .orbit::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ember);
      box-shadow: 0 0 24px rgba(232, 164, 90, 0.8);
      top: 50%;
      left: 0;
      transform: translate(-50%, -50%);
    }

    .orbit::after {
      left: auto;
      right: 0;
      transform: translate(50%, -50%);
      background: var(--glow);
      box-shadow: 0 0 24px rgba(126, 200, 163, 0.8);
      width: 7px;
      height: 7px;
    }

    .orbit.inner {
      width: min(48vw, 340px);
      animation-duration: 16s;
      animation-direction: reverse;
      border-color: rgba(126, 200, 163, 0.18);
    }

    .orbit.outer {
      width: min(88vw, 640px);
      animation-duration: 42s;
      opacity: 0.7;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .core {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 1.5rem;
      max-width: 34rem;
    }

    .brand {
      font-family: "Syne", "Vazirmatn", sans-serif;
      font-weight: 800;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      background: linear-gradient(120deg, var(--foam) 20%, var(--glow) 55%, var(--ember) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      animation: riseIn 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
    }

    .headline {
      margin-top: 1rem;
      font-size: clamp(1.05rem, 2.8vw, 1.35rem);
      font-weight: 600;
      color: var(--foam);
      opacity: 0;
      transform: translateY(18px);
      animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    }

    .sub {
      margin-top: 0.65rem;
      font-size: 0.98rem;
      color: var(--muted);
      line-height: 1.7;
      opacity: 0;
      transform: translateY(18px);
      animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
    }

    .cta {
      margin-top: 1.6rem;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.75rem 1.25rem;
      border: 1px solid rgba(232, 242, 236, 0.18);
      background: rgba(232, 242, 236, 0.04);
      color: var(--foam);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(18px);
      animation: riseIn 1s cubic-bezier(0.22, 1, 0.36, 1) 1.1s forwards;
      transition: border-color 0.25s, background 0.25s, transform 0.25s;
    }

    .cta:hover {
      border-color: rgba(126, 200, 163, 0.55);
      background: rgba(126, 200, 163, 0.1);
      transform: translateY(-2px);
    }

    .cta .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 12px rgba(126, 200, 163, 0.9);
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.65; }
    }

    @keyframes riseIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .burst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--foam);
      opacity: 0;
      animation: sparkFly 3.8s ease-out infinite;
    }

    @keyframes sparkFly {
      0% { opacity: 0; transform: translate(0, 0) scale(0.4); }
      15% { opacity: 0.9; }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
    }

    .replay-hint {
      position: absolute;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: rgba(155, 181, 168, 0.75);
      z-index: 3;
      opacity: 0;
      animation: riseIn 0.8s ease 2s forwards;
    }

    @media (max-width: 560px) {
      .orbit.outer { display: none; }
      .core { padding-inline: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="atmosphere"></div>
    <div class="grid" aria-hidden="true"></div>
    <div class="orbit outer" aria-hidden="true"></div>
    <div class="orbit" aria-hidden="true"></div>
    <div class="orbit inner" aria-hidden="true"></div>
    <div class="burst" id="burst" aria-hidden="true"></div>

    <div class="core">
      <h1 class="brand">CURSOR</h1>
      <p class="headline">نمونه‌ی انیمیشن ساخته‌شده با کد</p>
      <p class="sub">
        این یک دموی زنده است: نور، مدار، تایپوگرافی و حرکت —
        همه‌اش با HTML و CSS ساخته شده تا بتوانی نشان بدهی این توانایی را دارم.
      </p>
      <button class="cta" id="replay" type="button">
        <span class="dot" aria-hidden="true"></span>
        پخش دوباره
      </button>
    </div>

    <p class="replay-hint">برای نشان دادن به دیگران · فایل را در مرورگر باز کن</p>
  </div>

  <script>
    const burst = document.getElementById("burst");
    const stage = document.getElementById("stage");

    function spawnSparks() {
      burst.innerHTML = "";
      const count = 28;
      for (let i = 0; i < count; i++) {
        const s = document.createElement("span");
        s.className = "spark";
        const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
        const dist = 90 + Math.random() * 180;
        s.style.left = "50%";
        s.style.top = "42%";
        s.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
        s.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
        s.style.animationDelay = `${(i % 8) * 0.18 + Math.random() * 0.4}s`;
        s.style.background = i % 3 === 0 ? "#e8a45a" : i % 3 === 1 ? "#7ec8a3" : "#e8f2ec";
        burst.appendChild(s);
      }
    }

    function replay() {
      stage.querySelectorAll(".brand, .headline, .sub, .cta, .replay-hint").forEach((el) => {
        el.style.animation = "none";
        void el.offsetWidth;
        el.style.animation = "";
      });
      spawnSparks();
    }

    document.getElementById("replay").addEventListener("click", replay);
    spawnSparks();
  </script>
</body>
</html>
