experiment_name: mlp_synthetic_demo
tags:
  - example
  - mlp

data:
  batch_size: 64
  num_workers: 0
  shuffle: true
  normalize: true
  label_column: label

model:
  name: mlp
  input_dim: 20
  num_classes: 3
  hidden_dims: [128, 64]
  dropout: 0.1
  activation: gelu

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 10
  min_lr: 0.000001

training:
  output_dir: runs/mlp_demo
  epochs: 5
  grad_clip_norm: 1.0
  precision: fp32
  seed: 42
  log_every: 5
  save_every: 1
  early_stopping_patience: 3
  early_stopping_metric: val_loss
  early_stopping_mode: min
  accumulate_grad_batches: 1
  device: auto

inference:
  batch_size: 128
  device: auto
  precision: fp32
  temperature: 1.0
