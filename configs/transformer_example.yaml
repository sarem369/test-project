experiment_name: transformer_synthetic_demo
tags:
  - example
  - transformer

data:
  batch_size: 32
  max_length: 64
  normalize: false
  shuffle: true

model:
  name: transformer_classifier
  vocab_size: 1000
  num_classes: 4
  d_model: 128
  n_heads: 4
  n_layers: 2
  dim_feedforward: 256
  max_seq_len: 64
  dropout: 0.1
  activation: gelu

optimizer:
  name: adamw
  lr: 0.0005
  weight_decay: 0.01

scheduler:
  name: cosine
  warmup_steps: 20
  min_lr: 0.0000001

training:
  output_dir: runs/transformer_demo
  epochs: 3
  precision: fp32
  seed: 7
  log_every: 10
  device: auto

inference:
  batch_size: 64
  max_length: 64
  device: auto
